<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Tasks | Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .page-header h2 {
      margin: 0;
      font-weight: 700;
    }
    .task-list {
      max-width: 800px;
      margin: auto;
    }
    .list-group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .list-group-item h5 {
      margin: 0;
      font-weight: 600;
    }
    .list-group-item small {
      color: #6c757d;
    }
  </style>
</head>
<body class="container py-5">

  <!-- Page Header -->
  <div class="page-header">
    <h2>My Tasks</h2>
    <a href="user_dashboard.html" class="btn btn-outline-primary">&larr; Back to Dashboard</a>
  </div>

  <!-- Task List -->
  <div class="task-list">
    <ul id="userTaskList" class="list-group"></ul>
  </div>

  <script src="js/user_tasks.js"></script>
</body>
</html>
